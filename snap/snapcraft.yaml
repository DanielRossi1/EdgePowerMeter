name: edgepowermeter
version: '2.0.0'
title: EdgePowerMeter
summary: Real-time power analyser for embedded AI workloads
description: |
  EdgePowerMeter is a complete power monitoring solution designed to measure 
  voltage, current, and power consumption of embedded devices running AI 
  inference workloads. Perfect for benchmarking FPS-per-Watt efficiency.

  Features:
  - Real-time voltage, current and power plots, device-clock time base
  - Markers, segment statistics and FPS/W benchmark figures
  - Continuous crash-safe recording to CSV, CSV import/export, PDF reports
  - Power supply quality and frequency spectrum analysis
  - Remote sensor configuration, clock sync and calibration (firmware 2.x)
  - English, Italian, Spanish, French and German user interface
  - Dark, light or system theme

  Recordings are saved in Documents/EdgePowerMeter of your home folder.
  Connect the serial interfaces once after installing:
    sudo snap connect edgepowermeter:raw-usb
    sudo snap connect edgepowermeter:hardware-observe

license: Apache-2.0
website: https://github.com/DanielRossi1/EdgePowerMeter
source-code: https://github.com/DanielRossi1/EdgePowerMeter
issues: https://github.com/DanielRossi1/EdgePowerMeter/issues

base: core22
grade: stable
confinement: strict

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  edgepowermeter:
    command: bin/edgepowermeter
    desktop: share/applications/edgepowermeter.desktop
    extensions: [gnome]
    plugs:
      - home
      - network
      - serial-port
      - raw-usb
      - hardware-observe

parts:
  edgepowermeter:
    plugin: python
    source: .
    # A plain local pull copies the whole project folder, including untracked
    # local folders (.venv, build/, dist/, tools/i18n/.venv: gigabytes, copied
    # twice). Only the files needed to build the Python package are pulled.
    override-pull: |
      cp -r "$CRAFT_PROJECT_DIR/app" "$CRAFT_PROJECT_DIR/pyproject.toml" \
            "$CRAFT_PROJECT_DIR/README.md" "$CRAFT_PROJECT_DIR/LICENSE" "$CRAFT_PART_SRC/"
      find "$CRAFT_PART_SRC/app" -name "__pycache__" -type d -prune -exec rm -rf {} +
    python-packages:
      - PySide6-Essentials>=6.4.0
      - pyqtgraph>=0.13.0
      - pyserial>=3.5
      - reportlab>=4.0.0
      - numpy>=1.20.0
      - PyOpenGL>=3.1.0
    stage-packages:
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-keysyms1
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb-xinput0
      - libxcb-xkb1
      - libxcb-render-util0
      - pciutils
    override-build: |
      craftctl default
      # Create launcher script
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cat > $SNAPCRAFT_PART_INSTALL/bin/edgepowermeter << 'EOF'
      #!/bin/bash
      cd $SNAP
      exec $SNAP/bin/python3 -m app.main "$@"
      EOF
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/edgepowermeter

  desktop-file:
    plugin: dump
    source: snap/local
    organize:
      edgepowermeter.desktop: share/applications/edgepowermeter.desktop
      edgepowermeter.png: share/icons/hicolor/256x256/apps/edgepowermeter.png
